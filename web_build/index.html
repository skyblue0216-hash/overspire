<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Overspire - Layer 1: Hero Locomotion (south.png Direct)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #0c0e14; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    
    #canvas-container { 
      width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;
    }
    
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    canvas.pixelated {
      image-rendering: -moz-crisp-edges;
      image-rendering: -webkit-crisp-edges;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    /* HUD */
    #hud {
      position: absolute; top: 10px; left: 10px;
      max-width: 380px; width: calc(100vw - 20px);
      background: rgba(12, 16, 24, 0.88);
      border: 1px solid rgba(0, 208, 224, 0.35);
      border-radius: 8px;
      padding: 8px 12px;
      color: #eee;
      font-size: 12px;
      line-height: 1.4;
      box-shadow: 0 4px 16px rgba(0,0,0,0.6);
      z-index: 10;
      backdrop-filter: blur(4px);
    }
    #hud h1 { font-size: 14px; color: #00e5ff; margin-bottom: 4px; display: flex; align-items: center; gap: 6px; }
    #hud .stats { color: #94a3b8; font-family: monospace; font-size: 12px; margin-top: 4px; }
    
    /* Viewport angle buttons */
    .btn-row { margin-top: 8px; display: flex; gap: 6px; align-items: center; }
    .btn {
      padding: 5px 10px; border-radius: 4px; background: #1e293b; color: #cbd5e1;
      border: 1px solid #475569; font-size: 11px; cursor: pointer; font-weight: 500;
    }
    .btn.active {
      background: #0284c7; color: #fff; border-color: #38bdf8; font-weight: bold;
    }

    /* Guide */
    #guide {
      position: absolute; bottom: 12px; right: 12px;
      background: rgba(12, 16, 24, 0.85);
      border-radius: 6px; padding: 6px 12px;
      color: #94a3b8; font-size: 11px; pointer-events: none;
    }

    /* Virtual Joystick */
    #joystick-base {
      position: absolute; width: 130px; height: 130px; border-radius: 50%;
      background: rgba(15, 23, 42, 0.45); border: 2px solid rgba(0, 229, 255, 0.55);
      transform: translate(-50%, -50%); pointer-events: none; display: none; z-index: 5;
    }
    #joystick-knob {
      position: absolute; width: 52px; height: 52px; border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #38bdf8, #0284c7);
      border: 2px solid #ffffff; transform: translate(-50%, -50%);
      pointer-events: none; box-shadow: 0 2px 8px rgba(0,0,0,0.6); display: none; z-index: 6;
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
  <script src="js/GLTFLoader.js"></script>
</head>
<body>
  <div id="canvas-container"></div>

  <div id="hud">
    <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px;">
      <h1 style="font-size: 13px; color: #00e5ff; margin: 0; display: flex; align-items: center; gap: 6px;">
        ⚔️ Overspire <span id="hud-mini-stats" style="font-size: 11px; color: #94a3b8; font-weight: normal;">(0.0, 0.0)</span>
      </h1>
      <button class="btn" id="btn-toggle-hud" onclick="toggleHud()" style="padding: 2px 8px; font-size: 11px; background: #0284c7; color: #fff; cursor: pointer;">
        🔼 메뉴 접기
      </button>
    </div>

    <div id="hud-body" style="margin-top: 6px;">
      <div style="font-size: 11px; color: #94a3b8;">조작: <span style="color:#ffd2b2;">WASD / 방향키</span> 또는 <span style="color:#38bdf8;">가상 조이스틱</span></div>
      <div class="stats" id="stats-text" style="font-size: 11px;">위치: (0.0, 0.0) | 속도: 0.0 m/s</div>

      <!-- Style Switcher (Crossy Road 3D Voxel vs 2D Sprite) -->
      <div style="margin-top: 6px; display: flex; gap: 6px; align-items: center;">
        <span style="font-size: 11px; color: #94a3b8;">스타일:</span>
        <button class="btn active" id="btn-style-voxel" onclick="setStyle('voxel')">📦 3D 복셀</button>
        <button class="btn" id="btn-style-sprite" onclick="setStyle('sprite')">🖼️ 2D 도트</button>
      </div>

      <!-- Resolution Quality Switcher -->
      <div style="margin-top: 6px; display: flex; gap: 6px; align-items: center;">
        <span style="font-size: 11px; color: #94a3b8;">화질:</span>
        <button class="btn active" id="btn-quality-hd" onclick="setQuality('hd')">💎 HD 선명 모드</button>
        <button class="btn" id="btn-quality-retro" onclick="setQuality('retro')">👾 레트로 픽셀</button>
      </div>

      <!-- Real-time Equipment & Armor Switcher -->
      <div style="margin-top: 6px; padding: 6px 8px; background: rgba(0,0,0,0.35); border-radius: 6px; border: 1px solid rgba(255,255,255,0.08);">
        <div style="font-size: 11px; color: #38bdf8; font-weight: bold; margin-bottom: 4px;">🛡️ 장비 외형 교체 (실시간 3D 스왑):</div>
        <div style="display: flex; gap: 4px; flex-wrap: wrap;">
          <button class="btn active" id="btn-equip-default" onclick="setEquipment('default')">👔 기본 모험가</button>
          <button class="btn" id="btn-equip-iron" onclick="setEquipment('iron')">🛡️ 철갑옷 기사</button>
          <button class="btn active" id="btn-toggle-weapon" onclick="toggleWeapons()">⚔️ 검/방패</button>
        </div>
      </div>

      <!-- Real-time ViewSize Zoom Controller -->
      <div class="viewsize-control" style="margin-top: 8px; padding-top: 6px; border-top: 1px solid rgba(255,255,255,0.12);">
        <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 4px;">
          <span style="font-weight: bold; color: #38bdf8; font-size: 11px;">🔍 뷰사이즈 조절:</span>
          <div style="display: flex; align-items: center; gap: 4px;">
            <input type="number" id="view-size-input" value="14.4" min="4" max="50" step="0.5" 
                   onkeydown="event.stopPropagation()"
                   oninput="updateViewSize(this.value)"
                   style="width: 55px; background: #1e293b; color: #38bdf8; border: 1px solid #475569; border-radius: 4px; padding: 1px 4px; font-weight: bold; text-align: center; font-size: 11px;">
            <span style="color: #94a3b8; font-size: 11px;">m</span>
          </div>
        </div>
        <input type="range" id="view-size-slider" value="14.4" min="6" max="36" step="0.2" 
               oninput="updateViewSize(this.value)"
               style="width: 100%; accent-color: #0284c7; cursor: pointer; margin-bottom: 4px;">
        <div class="btn-row" style="display: flex; gap: 4px; flex-wrap: wrap;">
          <button class="btn" id="btn-zoom-close" onclick="updateViewSize(4.8)">🔍 4.8m (초근접)</button>
          <button class="btn" id="btn-7" onclick="updateViewSize(7.2)">7.2m</button>
          <button class="btn" id="btn-12" onclick="updateViewSize(12.0)">12.0m</button>
          <button class="btn active" id="btn-14" onclick="updateViewSize(14.4)">14.4m (기본)</button>
          <button class="btn" id="btn-19" onclick="updateViewSize(19.2)">19.2m</button>
          <button class="btn" id="btn-24" onclick="updateViewSize(24.0)">24.0m</button>
        </div>
      </div>
    </div>
  </div>

  <div id="guide">8-Directional Sprites (Top-Down 58° Fixed, ViewSize 14.4m)</div>

  <div id="joystick-base"></div>
  <div id="joystick-knob"></div>

  <script>
    // --- 1. Three.js Orthographic Scene ---
    const container = document.getElementById('canvas-container');
    let viewSize = 14.4; // Default viewSize (14.4m)
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0f1219);

    let width = window.innerWidth;
    let height = window.innerHeight;
    let aspect = width / height;

    const camera = new THREE.OrthographicCamera(
      -viewSize * aspect / 2, viewSize * aspect / 2,
      viewSize / 2, -viewSize / 2,
      0.1, 100
    );

    // Fixed Top-Down Orthogonal Viewport (Pitch: 56.6°, Height: 8.5, Distance: 5.2)
    const camHeight = 8.5;
    const camDistance = 5.2;
    const PITCH_ANGLE = Math.atan2(camHeight - 0.6, camDistance);
    camera.position.set(0, camHeight, camDistance);
    camera.rotation.set(-PITCH_ANGLE, 0, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;
    container.appendChild(renderer.domElement);

    let renderQuality = 'hd'; // 'hd' (Crystal Clear Native) or 'retro' (Downscaled Pixelated)

    function applyResolution() {
      width = window.innerWidth;
      height = window.innerHeight;
      aspect = width / height;

      camera.left = -viewSize * aspect / 2;
      camera.right = viewSize * aspect / 2;
      camera.top = viewSize / 2;
      camera.bottom = -viewSize / 2;
      camera.updateProjectionMatrix();

      const canvas = renderer.domElement;
      if (renderQuality === 'hd') {
        canvas.classList.remove('pixelated');
        renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2.5));
        renderer.setSize(width, height, true);
        canvas.style.width = '100%';
        canvas.style.height = '100%';
      } else {
        canvas.classList.add('pixelated');
        const scale = Math.max(1, Math.floor(height / 300));
        renderer.setPixelRatio(1.0);
        renderer.setSize(Math.round(width / scale), Math.round(height / scale), false);
        canvas.style.width = width + 'px';
        canvas.style.height = height + 'px';
      }
    }
    applyResolution();

    function setQuality(q) {
      renderQuality = q;
      document.getElementById('btn-quality-hd').classList.toggle('active', q === 'hd');
      document.getElementById('btn-quality-retro').classList.toggle('active', q === 'retro');
      applyResolution();
    }

    function updateViewSize(newVal) {
      const val = Math.max(4.0, Math.min(60.0, parseFloat(newVal) || 14.4));
      viewSize = val;
      const inp = document.getElementById('view-size-input');
      const sld = document.getElementById('view-size-slider');
      if (inp && document.activeElement !== inp) inp.value = val.toFixed(1);
      if (sld) sld.value = val;
      
      document.querySelectorAll('.btn-row .btn').forEach(b => {
        b.classList.remove('active');
        const match = b.textContent.match(/[\d\.]+/);
        const num = match ? parseFloat(match[0]) : NaN;
        if (!isNaN(num) && Math.abs(num - val) < 0.2) {
          b.classList.add('active');
        }
      });
      applyResolution();
    }

    let hudCollapsed = window.innerWidth < 768; // Start collapsed on mobile screens so character is never covered
    function updateHudDisplay() {
      const body = document.getElementById('hud-body');
      const btn = document.getElementById('btn-toggle-hud');
      if (!body || !btn) return;
      if (hudCollapsed) {
        body.style.display = 'none';
        btn.textContent = '🔽 메뉴 열기';
        btn.style.background = '#1e293b';
      } else {
        body.style.display = 'block';
        btn.textContent = '🔼 메뉴 접기';
        btn.style.background = '#0284c7';
      }
    }
    function toggleHud() {
      hudCollapsed = !hudCollapsed;
      updateHudDisplay();
    }
    updateHudDisplay();

    let currentStyle = 'voxel';
    function setStyle(mode) {
      currentStyle = mode;
      document.getElementById('btn-style-voxel').classList.toggle('active', mode === 'voxel');
      document.getElementById('btn-style-sprite').classList.toggle('active', mode === 'sprite');
      if (mode === 'voxel') {
        if (voxelHero) voxelHero.visible = true;
        if (spriteMesh) spriteMesh.visible = false;
      } else {
        if (voxelHero) voxelHero.visible = false;
        if (spriteMesh) spriteMesh.visible = true;
      }
    }

    let currentEquipment = 'default';
    let showWeapons = true;

    function setEquipment(mode) {
      currentEquipment = mode;
      document.getElementById('btn-equip-default').classList.toggle('active', mode === 'default');
      document.getElementById('btn-equip-iron').classList.toggle('active', mode === 'iron');

      if (!armorParts.torso) return;

      if (mode === 'default') {
        // Default Beige Cotton Adventurer Outfit
        armorParts.torso.material.color.setHex(0xd0bd95);
        armorParts.collarL.material.color.setHex(0xe4d6b6);
        armorParts.collarR.material.color.setHex(0xe4d6b6);
        armorParts.belt.material.color.setHex(0x5b4535);
        armorParts.buckle.material.color.setHex(0xf5c542);
        armorParts.leftSleeve.material.color.setHex(0xd0bd95);
        armorParts.rightSleeve.material.color.setHex(0xd0bd95);
        armorParts.leftPants.material.color.setHex(0x1a1618);
        armorParts.rightPants.material.color.setHex(0x1a1618);
        armorParts.leftBoot.material.color.setHex(0x814126);
        armorParts.rightBoot.material.color.setHex(0x814126);
        armorParts.leftSole.material.color.setHex(0x2f1613);
        armorParts.rightSole.material.color.setHex(0x2f1613);

        armorParts.ironCrossV.visible = false;
        armorParts.ironCrossH.visible = false;
        armorParts.leftPauldron.visible = false;
        armorParts.rightPauldron.visible = false;
        armorParts.leftKnee.visible = false;
        armorParts.rightKnee.visible = false;
      } else if (mode === 'iron') {
        // Polished Steel Knight Armor with Gold Lion Cross & Chainmail
        armorParts.torso.material.color.setHex(0xa6b8cb);     // Steel breastplate
        armorParts.collarL.material.color.setHex(0xd8e6f3);   // Steel gorget plate
        armorParts.collarR.material.color.setHex(0xd8e6f3);
        armorParts.belt.material.color.setHex(0x424e5b);      // Heavy iron belt
        armorParts.buckle.material.color.setHex(0xf5c542);    // Gold crest buckle
        armorParts.leftSleeve.material.color.setHex(0x7e90a2);// Steel arm armor
        armorParts.rightSleeve.material.color.setHex(0x7e90a2);
        armorParts.leftPants.material.color.setHex(0x505c69); // Chainmail cuisses
        armorParts.rightPants.material.color.setHex(0x505c69);
        armorParts.leftBoot.material.color.setHex(0x7c8e9f);  // Steel Sabatons
        armorParts.rightBoot.material.color.setHex(0x7c8e9f);
        armorParts.leftSole.material.color.setHex(0x283039);  // Iron sole

        armorParts.ironCrossV.visible = true;
        armorParts.ironCrossH.visible = true;
        armorParts.leftPauldron.visible = true;
        armorParts.rightPauldron.visible = true;
        armorParts.leftKnee.visible = true;
        armorParts.rightKnee.visible = true;
        showWeapons = true;
        updateWeaponVisibility();
      }
    }

    function toggleWeapons() {
      showWeapons = !showWeapons;
      updateWeaponVisibility();
    }

    function updateWeaponVisibility() {
      const btn = document.getElementById('btn-toggle-weapon');
      if (btn) btn.classList.toggle('active', showWeapons);
      if (armorParts.swordGroup) armorParts.swordGroup.visible = showWeapons;
      if (armorParts.shieldGroup) armorParts.shieldGroup.visible = showWeapons;
    }

    function lerpAngle(from, to, weight) {
      let diff = to - from;
      while (diff < -Math.PI) diff += Math.PI * 2;
      while (diff > Math.PI) diff -= Math.PI * 2;
      return from + diff * Math.min(1.0, weight);
    }

    // --- 2. Lighting (Crisp Top-Down Diorama Sunlight & Soft Ambient) ---
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.85);
    scene.add(ambientLight);

    const hemiLight = new THREE.HemisphereLight(0xe8f0ff, 0x181e28, 0.65);
    scene.add(hemiLight);

    const dirLight = new THREE.DirectionalLight(0xfffaed, 1.35);
    dirLight.position.set(6, 14, 8);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.width = 1024;
    dirLight.shadow.mapSize.height = 1024;
    dirLight.shadow.camera.near = 1.0;
    dirLight.shadow.camera.far = 30.0;
    dirLight.shadow.bias = -0.0004;
    scene.add(dirLight);

    // --- 3. Dungeon Arena ---
    const floorGroup = new THREE.Group();
    scene.add(floorGroup);

    const tileGeo = new THREE.PlaneGeometry(1.0, 1.0);
    const tileMatA = new THREE.MeshLambertMaterial({ color: 0x242833 });
    const tileMatB = new THREE.MeshLambertMaterial({ color: 0x1d212b });

    for (let x = -8; x <= 8; x++) {
      for (let z = -8; z <= 8; z++) {
        const mat = (Math.abs(x + z) % 2 === 0) ? tileMatA : tileMatB;
        const tile = new THREE.Mesh(tileGeo, mat);
        tile.position.set(x, 0, z);
        tile.rotation.x = -Math.PI / 2;
        tile.receiveShadow = true;
        floorGroup.add(tile);
      }
    }

    const wallMat = new THREE.MeshLambertMaterial({ color: 0x14171f });
    const createWall = (w, h, d, x, z) => {
      const geo = new THREE.BoxGeometry(w, h, d);
      const mesh = new THREE.Mesh(geo, wallMat);
      mesh.position.set(x, h/2, z);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      scene.add(mesh);
    };
    createWall(18, 1.8, 0.8, 0, -9);
    createWall(18, 1.8, 0.8, 0, 9);
    createWall(0.8, 1.8, 18, -9, 0);
    createWall(0.8, 1.8, 18, 9, 0);

    const pillars = [
      { x: -3.5, z: -3.5, r: 0.55 },
      { x: 3.5, z: -3.5, r: 0.55 },
      { x: -3.5, z: 3.5, r: 0.55 },
      { x: 3.5, z: 3.5, r: 0.55 }
    ];
    const pillarMat = new THREE.MeshLambertMaterial({ color: 0x363c48 });
    pillars.forEach(p => {
      const geo = new THREE.CylinderGeometry(0.5, 0.55, 2.0, 12);
      const m = new THREE.Mesh(geo, pillarMat);
      m.position.set(p.x, 1.0, p.z);
      m.castShadow = true;
      m.receiveShadow = true;
      scene.add(m);
    });

    // --- 4. Hero Representation (3D Crossy Road Voxel Model + 2D Sprite Backup) ---
    const heroGroup = new THREE.Group();
    scene.add(heroGroup);

    // Oval Ground Shadow
    const shadowGeo = new THREE.CylinderGeometry(0.38, 0.38, 0.01, 16);
    const shadowMat = new THREE.MeshBasicMaterial({ color: 0x05070a, transparent: true, opacity: 0.55 });
    const shadowMesh = new THREE.Mesh(shadowGeo, shadowMat);
    shadowMesh.position.y = 0.01;
    heroGroup.add(shadowMesh);

    // --- Dust Particle Pool (Juicy Crossy Road Landing Poofs) ---
    const dustPool = [];
    const DUST_COUNT = 18;
    const dustGeo = new THREE.BoxGeometry(0.08, 0.08, 0.08);
    const dustMat = new THREE.MeshBasicMaterial({ color: 0xb5aba0, transparent: true, opacity: 0.85 });
    for (let i = 0; i < DUST_COUNT; i++) {
      const p = new THREE.Mesh(dustGeo, dustMat.clone());
      p.visible = false;
      p.userData = { life: 0, maxLife: 0.28, vx: 0, vy: 0, vz: 0 };
      scene.add(p);
      dustPool.push(p);
    }

    function spawnLandingDust(x, z) {
      let spawned = 0;
      for (let i = 0; i < dustPool.length && spawned < 5; i++) {
        const p = dustPool[i];
        if (!p.visible) {
          p.visible = true;
          p.position.set(x + (Math.random() - 0.5) * 0.28, 0.04, z + (Math.random() - 0.5) * 0.28);
          const angle = Math.random() * Math.PI * 2;
          const spd = 0.7 + Math.random() * 1.1;
          p.userData.vx = Math.cos(angle) * spd;
          p.userData.vy = 0.8 + Math.random() * 0.8;
          p.userData.vz = Math.sin(angle) * spd;
          p.userData.life = 0.26;
          p.userData.maxLife = 0.26;
          p.scale.setScalar(1.0);
          spawned++;
        }
      }
    }

    function updateDust(dt) {
      for (let i = 0; i < dustPool.length; i++) {
        const p = dustPool[i];
        if (p.visible) {
          p.userData.life -= dt;
          if (p.userData.life <= 0) {
            p.visible = false;
          } else {
            const progress = 1.0 - (p.userData.life / p.userData.maxLife);
            p.position.x += p.userData.vx * dt;
            p.position.y += p.userData.vy * dt;
            p.position.z += p.userData.vz * dt;
            p.userData.vy -= 4.2 * dt; // gravity
            const scale = Math.max(0.01, 1.0 - progress);
            p.scale.set(scale, scale, scale);
            p.material.opacity = 0.85 * (1.0 - progress);
          }
        }
      }
    }

    // ========================================================
    // --- 3D Procedural Voxel Hero Model (Crossy Road Aesthetic) ---
    // ========================================================
    const voxelHero = new THREE.Group();
    heroGroup.add(voxelHero);

    // Root Body Pivot (handles hop squash/stretch, hop arc, and forward momentum lean)
    const bodyPivot = new THREE.Group();
    voxelHero.add(bodyPivot);

    const createVoxel = (w, h, d, color, x, y, z, parent = bodyPivot) => {
      const geo = new THREE.BoxGeometry(w, h, d);
      const mat = new THREE.MeshLambertMaterial({ color: color });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.position.set(x, y, z);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      parent.add(mesh);
      return mesh;
    };

    // --- Equipment & Armor Parts ---
    const armorParts = {
      torso: null,
      collarL: null,
      collarR: null,
      belt: null,
      buckle: null,
      leftSleeve: null,
      rightSleeve: null,
      leftPants: null,
      rightPants: null,
      leftBoot: null,
      rightBoot: null,
      leftSole: null,
      rightSole: null,
      ironCrossV: null,
      ironCrossH: null,
      leftPauldron: null,
      rightPauldron: null,
      leftKnee: null,
      rightKnee: null,
      swordGroup: null,
      shieldGroup: null,
    };

    // --- A. Torso & Adventurer Shirt ---
    // Rolled-sleeve sand/beige shirt (w: 0.44m, h: 0.38m, d: 0.28m)

    const dirKeys = [

    // --- 5. Locomotion Kinematics ---
    const MAX_SPEED = 5.2;
    const ACCEL = 42.0;
    const FRICTION = 48.0;
    const HERO_RADIUS = 0.35;

    let posX = 0.0, posZ = 0.0;
    let velX = 0.0, velZ = 0.0;
    let facingX = 0.0, facingZ = 1.0;
    let animTime = 0.0;
    let stepTimer = 0.0;
    const STEP_RATE = 1.0 / 12.0; // 12 FPS Walk Cycle

    // Crossy Road Hopping Variables
    let hopCycle = 0.0;
    let prevHopPhase = 0.0;

    const keys = { w: false, a: false, s: false, d: false, ArrowUp: false, ArrowLeft: false, ArrowDown: false, ArrowRight: false };
    let joyX = 0.0, joyY = 0.0;

    window.addEventListener('keydown', e => { if (keys.hasOwnProperty(e.key)) keys[e.key] = true; });
    window.addEventListener('keyup', e => { if (keys.hasOwnProperty(e.key)) keys[e.key] = false; });

    // Touch Virtual Joystick
    const joyBase = document.getElementById('joystick-base');
    const joyKnob = document.getElementById('joystick-knob');
    let isTouching = false;
    let touchStartX = 0, touchStartY = 0;

    function handleStart(x, y) {
      if (x < window.innerWidth * 0.55) {
        isTouching = true;
        touchStartX = x; touchStartY = y;
        joyBase.style.display = 'block'; joyBase.style.left = x + 'px'; joyBase.style.top = y + 'px';
        joyKnob.style.display = 'block'; joyKnob.style.left = x + 'px'; joyKnob.style.top = y + 'px';
      }
    }
    function handleMove(x, y) {
      if (!isTouching) return;
      let dx = x - touchStartX, dy = y - touchStartY;
      const maxDist = 65.0;
      const dist = Math.hypot(dx, dy);
      if (dist > maxDist) { dx = (dx / dist) * maxDist; dy = (dy / dist) * maxDist; }
      joyKnob.style.left = (touchStartX + dx) + 'px';
      joyKnob.style.top = (touchStartY + dy) + 'px';
      const norm = dist / maxDist;
      if (norm > 0.15) { joyX = dx / maxDist; joyY = dy / maxDist; }
      else { joyX = 0; joyY = 0; }
    }
    function handleEnd() {
      isTouching = false; joyX = 0; joyY = 0;
      joyBase.style.display = 'none'; joyKnob.style.display = 'none';
    }

    window.addEventListener('touchstart', e => { handleStart(e.touches[0].clientX, e.touches[0].clientY); });
    window.addEventListener('touchmove', e => { handleMove(e.touches[0].clientX, e.touches[0].clientY); });
    window.addEventListener('touchend', handleEnd);
    window.addEventListener('mousedown', e => { handleStart(e.clientX, e.clientY); });
    window.addEventListener('mousemove', e => { handleMove(e.clientX, e.clientY); });
    window.addEventListener('mouseup', handleEnd);

    // --- 6. Main Render Loop ---
    let lastTime = performance.now();
    const statsText = document.getElementById('stats-text');

    function animate(currentTime) {
      requestAnimationFrame(animate);
      const dt = Math.min((currentTime - lastTime) / 1000, 0.1);
      lastTime = currentTime;

      // Calculate Input
      let inputX = (keys.d || keys.ArrowRight ? 1 : 0) - (keys.a || keys.ArrowLeft ? 1 : 0);
      let inputZ = (keys.s || keys.ArrowDown ? 1 : 0) - (keys.w || keys.ArrowUp ? 1 : 0);

      if (Math.hypot(joyX, joyY) > 0.1) {
        inputX = joyX;
        inputZ = joyY;
      }

      const inputLen = Math.hypot(inputX, inputZ);
      let targetDirX = 0, targetDirZ = 0;
      if (inputLen > 0.05) {
        targetDirX = inputX / Math.max(1.0, inputLen);
        targetDirZ = inputZ / Math.max(1.0, inputLen);
      }

      // Kinematics: Acceleration & Braking
      if (inputLen > 0.05) {
        velX = moveToward(velX, targetDirX * MAX_SPEED, ACCEL * dt);
        velZ = moveToward(velZ, targetDirZ * MAX_SPEED, ACCEL * dt);
        facingX = targetDirX;
        facingZ = targetDirZ;
      } else {
        velX = moveToward(velX, 0, FRICTION * dt);
        velZ = moveToward(velZ, 0, FRICTION * dt);
      }

      const speed = Math.hypot(velX, velZ);

      // Update Dust Particles
      updateDust(dt);

      // 8-Directional Angle Calculation (used for both sprite texture and stats/yaw)
      const deg = Math.atan2(facingX, facingZ) * (180 / Math.PI);
      let dirKey = 'south';
      let dirName = '남쪽 (정면)';

      if (deg >= -22.5 && deg < 22.5) {
        dirKey = 'south'; dirName = '남쪽 (정면)';
      } else if (deg >= 22.5 && deg < 67.5) {
        dirKey = 'south-east'; dirName = '남동쪽';
      } else if (deg >= 67.5 && deg < 112.5) {
        dirKey = 'east'; dirName = '동쪽 (우측)';
      } else if (deg >= 112.5 && deg < 157.5) {
        dirKey = 'north-east'; dirName = '북동쪽';
      } else if (deg >= 157.5 || deg < -157.5) {
        dirKey = 'north'; dirName = '북쪽 (뒷모습)';
      } else if (deg >= -157.5 && deg < -112.5) {
        dirKey = 'north-west'; dirName = '북서쪽';
      } else if (deg >= -112.5 && deg < -67.5) {
        dirKey = 'west'; dirName = '서쪽 (좌측)';
      } else {
        dirKey = 'south-west'; dirName = '남서쪽';
      }

      // -------------------------------------------------------------------------
      // Visual Style Mode Logic: 3D Voxel (Crossy Road) vs 2D Billboard Sprite
      // -------------------------------------------------------------------------
      if (currentStyle === 'voxel') {
        voxelHero.visible = true;
        spriteMesh.visible = false;

        if (speed > 0.15) {
          // --- Crossy Road Rhythmic Hopping Locomotion ---
          const hopSpeed = (speed / MAX_SPEED) * (Math.PI * 4.6);
          hopCycle += hopSpeed * dt;
          const hopPhase = hopCycle % Math.PI;

          // Landing detection -> dust poofs!
          if (prevHopPhase > 2.2 && hopPhase < 1.0) {
            spawnLandingDust(posX, posZ);
          }
          prevHopPhase = hopPhase;

          // Parabolic hop arc (0.0 to 1.0)
          const hopArc = Math.sin(hopPhase);
          bodyPivot.position.y = hopArc * 0.32; // Jump height

          // Crossy Road Squash & Stretch
          // On takeoff/landing (hopArc ~ 0): squash wide (0.84 Y, 1.12 XZ)
          // At peak (hopArc ~ 1): stretch tall (1.20 Y, 0.90 XZ)
          const stretchY = 0.84 + hopArc * 0.36;
          const stretchXZ = 1.12 - hopArc * 0.22;
          bodyPivot.scale.set(stretchXZ, stretchY, stretchXZ);

          // Forward momentum lean tilt (~13 degrees into direction of travel)
          bodyPivot.rotation.x = -hopArc * 0.22;

          // Alternating Leg kicks and Heroic Arm rhythm
          const stepIdx = Math.floor(hopCycle / Math.PI);
          const legSide = (stepIdx % 2 === 0) ? 1.0 : -1.0;
          const legSwing = Math.sin(hopPhase) * legSide * 0.58;
          if (leftLegPivot) {
            leftLegPivot.rotation.x = legSwing;
          }
          if (rightLegPivot) {
            rightLegPivot.rotation.x = -legSwing;
          }
          // Shield guard bobs defensively in front
          if (leftArmPivot) {
            leftArmPivot.rotation.x = -0.55 - Math.sin(hopPhase) * 0.16;
            leftArmPivot.rotation.y = 0.35 + Math.cos(hopPhase) * 0.05;
            leftArmPivot.rotation.z = 0.15;
          }
          // Sword hand pumps actively forward in ready strike
          if (rightArmPivot) {
            rightArmPivot.rotation.x = -0.70 + Math.sin(hopPhase) * 0.22;
            rightArmPivot.rotation.y = -0.20 + Math.cos(hopPhase) * 0.05;
            rightArmPivot.rotation.z = -0.10;
          }

          // Dynamic Ground Shadow (shrinks & fades at jump apex)
          const shadowScale = 1.0 - hopArc * 0.35;
          shadowMesh.scale.set(shadowScale, 1.0, shadowScale);
          shadowMat.opacity = 0.55 - hopArc * 0.25;

          // Smooth 3D Yaw Rotation toward movement direction
          const targetYaw = Math.atan2(facingX, facingZ);
          voxelHero.rotation.y = lerpAngle(voxelHero.rotation.y, targetYaw, 18.0 * dt);
        } else {
          // Idle state: smooth settle with heroic combat guard breathing
          hopCycle = 0.0;
          prevHopPhase = 0.0;
          bodyPivot.position.y = moveToward(bodyPivot.position.y, 0, 4.0 * dt);
          bodyPivot.rotation.x = moveToward(bodyPivot.rotation.x, 0, 6.0 * dt);
          if (leftLegPivot) leftLegPivot.rotation.x = moveToward(leftLegPivot.rotation.x, 0, 8.0 * dt);
          if (rightLegPivot) rightLegPivot.rotation.x = moveToward(rightLegPivot.rotation.x, 0, 8.0 * dt);

          // Heroic guard stance breathing (sword and shield stay forward!)
          const idleBreath = Math.sin(currentTime * 0.0035) * 0.025;
          if (leftArmPivot) {
            leftArmPivot.rotation.x = moveToward(leftArmPivot.rotation.x, -0.55 + idleBreath, 5.0 * dt);
            leftArmPivot.rotation.y = moveToward(leftArmPivot.rotation.y, 0.35, 5.0 * dt);
            leftArmPivot.rotation.z = moveToward(leftArmPivot.rotation.z, 0.15, 5.0 * dt);
          }
          if (rightArmPivot) {
            rightArmPivot.rotation.x = moveToward(rightArmPivot.rotation.x, -0.70 - idleBreath, 5.0 * dt);
            rightArmPivot.rotation.y = moveToward(rightArmPivot.rotation.y, -0.20, 5.0 * dt);
            rightArmPivot.rotation.z = moveToward(rightArmPivot.rotation.z, -0.10, 5.0 * dt);
          }

          const breath = Math.sin(currentTime * 0.0035) * 0.025;
          bodyPivot.scale.set(1.0 - breath, 1.0 + breath, 1.0 - breath);

          shadowMesh.scale.set(1.0, 1.0, 1.0);
          shadowMat.opacity = 0.55;
        }

        statsText.textContent = `[3D 복셀: ${currentEquipment === 'iron' ? '🛡️ 철갑옷 기사 세트' : '👔 기본 모험가 복장'}${showWeapons ? ' (검/방패 장착)' : ''}] 위치: (${posX.toFixed(1)}, ${posZ.toFixed(1)}) | 속도: ${speed.toFixed(1)} m/s | 홉: ${speed > 0.15 ? '뜀박질' : '대기'}`;
      } else {
        // --- 2D Billboard Sprite Mode ---
        voxelHero.visible = false;
        spriteMesh.visible = true;

        if (speed > 0.15) {
          stepTimer += dt;
          if (stepTimer >= STEP_RATE) {
            stepTimer = 0.0;
            animTime += STEP_RATE * 14.0;
            const bounce = Math.abs(Math.sin(animTime)) * 0.08;
            const squash = 1.0 + Math.sin(animTime) * 0.05;
            spriteMesh.position.y = 0.70 + bounce;
            spriteMesh.scale.set(1.4, 1.4 * squash, 1.4);
          }
        } else {
          spriteMesh.position.y = 0.70;
          spriteMesh.scale.set(1.4, 1.4, 1.4);
          animTime = 0.0;
        }

        const activeTex = textures[dirKey] || textures.south;
        if (activeTex && spriteMat.map !== activeTex) {
          spriteMat.map = activeTex;
          spriteMat.needsUpdate = true;
        }

        spriteMesh.quaternion.copy(camera.quaternion);
        shadowMesh.scale.set(1.0, 1.0, 1.0);
        shadowMat.opacity = 0.55;

        statsText.textContent = `[2D 도트 스프라이트] 위치: (${posX.toFixed(1)}, ${posZ.toFixed(1)}) | 속도: ${speed.toFixed(1)} m/s | 방향: ${dirName} (${dirKey}.png) | 원본 8방향 텍스처`;
      }

      const miniStats = document.getElementById('hud-mini-stats');
      if (miniStats) {
        miniStats.textContent = `(${posX.toFixed(1)}, ${posZ.toFixed(1)}) | ${speed.toFixed(1)}m/s`;
      }

      // Boundaries & Obstacle Collisions
      let nextX = posX + velX * dt;
      let nextZ = posZ + velZ * dt;

      nextX = Math.max(-8.2, Math.min(8.2, nextX));
      nextZ = Math.max(-8.2, Math.min(8.2, nextZ));

      pillars.forEach(p => {
        const dx = nextX - p.x;
        const dz = nextZ - p.z;
        const dist = Math.hypot(dx, dz);
        const minDist = p.r + HERO_RADIUS;
        if (dist < minDist && dist > 0.001) {
          const pushX = (dx / dist) * (minDist - dist);
          const pushZ = (dz / dist) * (minDist - dist);
          nextX += pushX;
          nextZ += pushZ;
        }
      });

      posX = nextX;
      posZ = nextZ;
      heroGroup.position.set(posX, 0, posZ);

      // Camera Smooth Tracking (Translation Only - ZERO Rotation / Map Tilt)
      camera.position.x += (posX - camera.position.x) * 6.5 * dt;
      camera.position.y = camHeight;
      camera.position.z += ((posZ + camDistance) - camera.position.z) * 6.5 * dt;
      // Absolute lock: zero yaw, zero roll, purely parallel map view
      camera.rotation.set(-PITCH_ANGLE, 0, 0);

      renderer.render(scene, camera);
    }

    function moveToward(current, target, maxDelta) {
      if (Math.abs(target - current) <= maxDelta) return target;
      return current + Math.sign(target - current) * maxDelta;
    }

    window.addEventListener('resize', applyResolution);
    requestAnimationFrame(animate);
  </script>
</body>
</html>
