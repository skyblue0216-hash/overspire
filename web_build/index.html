<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Overspire - Layer 2: Micro Bump Combat</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #0c0e14; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    
    #canvas-container { 
      width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;
    }
    
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    canvas.pixelated {
      image-rendering: -moz-crisp-edges;
      image-rendering: -webkit-crisp-edges;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    /* HUD */
    #hud {
      position: absolute; top: 10px; left: 10px;
      max-width: 400px; width: calc(100vw - 20px);
      background: rgba(12, 16, 24, 0.90);
      border: 1px solid rgba(0, 208, 224, 0.40);
      border-radius: 8px;
      padding: 10px 14px;
      color: #eee;
      font-size: 12px;
      line-height: 1.4;
      box-shadow: 0 4px 20px rgba(0,0,0,0.65);
      z-index: 10;
      backdrop-filter: blur(5px);
    }
    #hud h1 { font-size: 14px; color: #00e5ff; margin-bottom: 4px; display: flex; align-items: center; gap: 6px; }
    
    /* Health & Cooldown Bars */
    .bar-container { display: flex; align-items: center; gap: 8px; margin: 3px 0; }
    .bar-label { width: 62px; font-size: 11px; font-weight: 600; color: #cbd5e1; }
    .bar-bg { flex: 1; height: 10px; background: #1e293b; border-radius: 5px; overflow: hidden; border: 1px solid #334155; }
    .bar-fill { height: 100%; transition: width 0.15s ease-out; }
    .fill-hero { background: linear-gradient(90deg, #10b981, #34d399); }
    .fill-dummy { background: linear-gradient(90deg, #f59e0b, #fbbf24); }
    .fill-cooldown { background: linear-gradient(90deg, #0284c7, #38bdf8); }

    /* Combat Notification Banner */
    #combat-banner {
      margin-top: 6px; padding: 6px 10px; border-radius: 6px;
      font-weight: bold; font-size: 11px; text-align: center;
      background: rgba(30, 41, 59, 0.8); border: 1px solid #475569;
      color: #94a3b8; transition: all 0.2s;
    }
    #combat-banner.frontal {
      background: rgba(220, 38, 38, 0.25); border-color: #ef4444; color: #fca5a5;
    }
    #combat-banner.advantage {
      background: rgba(16, 185, 129, 0.25); border-color: #10b981; color: #6ee7b7;
    }

    /* Buttons */
    .btn-row { margin-top: 6px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
    .btn {
      padding: 4px 8px; border-radius: 4px; background: #1e293b; color: #cbd5e1;
      border: 1px solid #475569; font-size: 11px; cursor: pointer; font-weight: 500;
    }
    .btn.active {
      background: #0284c7; color: #fff; border-color: #38bdf8; font-weight: bold;
    }

    /* Floating Combat Text Container */
    #floating-text-container {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none; overflow: hidden; z-index: 15;
    }
    .floating-dmg {
      position: absolute; font-weight: 900; font-family: monospace;
      text-shadow: 0 2px 4px rgba(0,0,0,0.8), 0 0 8px rgba(0,0,0,0.9);
      transform: translate(-50%, -50%);
      pointer-events: none;
      animation: floatUp 0.8s ease-out forwards;
    }
    @keyframes floatUp {
      0% { opacity: 0; transform: translate(-50%, 0) scale(0.6); }
      15% { opacity: 1; transform: translate(-50%, -15px) scale(1.3); }
      40% { transform: translate(-50%, -28px) scale(1.0); }
      100% { opacity: 0; transform: translate(-50%, -55px) scale(0.85); }
    }

    /* Guide overlay */
    #guide-box {
      position: absolute; bottom: 12px; right: 12px;
      max-width: 320px; background: rgba(12, 16, 24, 0.90);
      border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 6px;
      padding: 8px 12px; font-size: 11px; color: #94a3b8; line-height: 1.4;
      pointer-events: none; z-index: 5;
    }
    #guide-box b { color: #f8fafc; }

    /* Virtual Joystick */
    #joystick-base {
      position: absolute; width: 130px; height: 130px; border-radius: 50%;
      background: rgba(15, 23, 42, 0.45); border: 2px solid rgba(0, 229, 255, 0.55);
      transform: translate(-50%, -50%); pointer-events: none; display: none; z-index: 5;
    }
    #joystick-knob {
      position: absolute; width: 52px; height: 52px; border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #38bdf8, #0284c7);
      border: 2px solid #ffffff; transform: translate(-50%, -50%);
      pointer-events: none; box-shadow: 0 2px 8px rgba(0,0,0,0.6); display: none; z-index: 6;
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
</head>
<body>
  <div id="canvas-container"></div>
  <div id="floating-text-container"></div>

  <!-- Main HUD -->
  <div id="hud">
    <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px;">
      <h1 style="font-size: 13px; color: #00e5ff; margin: 0;">
        ⚔️ Overspire <span style="font-size: 11px; color: #f59e0b; font-weight: normal;">[Layer 2: Micro Bump]</span>
      </h1>
      <button class="btn" id="btn-toggle-hud" onclick="toggleHud()" style="padding: 2px 8px; font-size: 11px; background: #0284c7; color: #fff;">
        🔼 접기
      </button>
    </div>

    <div id="hud-body" style="margin-top: 6px;">
      <!-- Hero Health Bar -->
      <div class="bar-container">
        <span class="bar-label">용사 HP</span>
        <div class="bar-bg">
          <div class="bar-fill fill-hero" id="hero-hp-fill" style="width: 100%;"></div>
        </div>
        <span id="hero-hp-val" style="width: 50px; text-align: right; font-family: monospace; font-size: 11px;">100/100</span>
      </div>

      <!-- Dummy Target Health Bar -->
      <div class="bar-container">
        <span class="bar-label">더미 HP</span>
        <div class="bar-bg">
          <div class="bar-fill fill-dummy" id="dummy-hp-fill" style="width: 100%;"></div>
        </div>
        <span id="dummy-hp-val" style="width: 50px; text-align: right; font-family: monospace; font-size: 11px;">100/100</span>
      </div>

      <!-- Attack Cooldown Gauge -->
      <div class="bar-container">
        <span class="bar-label">쿨다운</span>
        <div class="bar-bg">
          <div class="bar-fill fill-cooldown" id="cooldown-fill" style="width: 0%;"></div>
        </div>
        <span id="cooldown-val" style="width: 50px; text-align: right; font-family: monospace; font-size: 11px;">READY</span>
      </div>

      <!-- Real-time Combat Notification Banner -->
      <div id="combat-banner">
        더미 인형(나무 기둥)을 향해 들이받아 보세요!
      </div>

      <!-- View Size & Zoom Controller -->
      <div style="margin-top: 6px; padding-top: 6px; border-top: 1px solid rgba(255,255,255,0.1);">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px;">
          <span style="font-size: 11px; color: #38bdf8; font-weight: bold;">🔍 직교 뷰사이즈:</span>
          <span id="view-size-text" style="font-size: 11px; color: #94a3b8; font-family: monospace;">14.4m (기본)</span>
        </div>
        <div class="btn-row">
          <button class="btn" onclick="updateViewSize(7.2)">7.2m</button>
          <button class="btn" onclick="updateViewSize(10.8)">10.8m</button>
          <button class="btn active" id="btn-14" onclick="updateViewSize(14.4)">14.4m</button>
          <button class="btn" onclick="updateViewSize(18.0)">18.0m</button>
          <button class="btn" onclick="resetDummyPosition()" style="background: #334155; margin-left: auto;">🔄 더미 리셋</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Guide Box -->
  <div id="guide-box">
    <b>💡 범프 전투 원칙 (Layer 2)</b><br>
    • <b>정면 충돌 (빨간 뿔 90° 이내)</b>: 상호 피해 발생! 용사도 피격됨.<br>
    • <b>측/후면 공격 (270° 영역)</b>: 일방 타격! 용사 피해 0, 적에게 큰 넉백.<br>
    • <b>0.35s 쿨다운 & 분리 임펄스</b>: 무적 시간 없이도 연타 버그 방지!
  </div>

  <!-- Touch Joystick -->
  <div id="joystick-base"></div>
  <div id="joystick-knob"></div>

  <script>
    // ========================================================
    // --- 1. Scene, Camera, & Compatibility Renderer Setup ---
    // ========================================================
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0e1118);

    const aspect = window.innerWidth / window.innerHeight;
    let orthoSize = 14.4;
    const camera = new THREE.OrthographicCamera(
      -orthoSize * aspect / 2, orthoSize * aspect / 2,
      orthoSize / 2, -orthoSize / 2,
      0.1, 1000
    );

    // Standard 2.5D Orthogonal Tilt: 56.6 degrees
    const PITCH = 56.6 * (Math.PI / 180);
    const CAM_DIST = 18.0;
    const CAM_Y = Math.sin(PITCH) * CAM_DIST;
    const CAM_Z = Math.cos(PITCH) * CAM_DIST;
    camera.position.set(0, CAM_Y, CAM_Z);
    camera.rotation.set(-PITCH, 0, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2.0));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    container.appendChild(renderer.domElement);

    // Lighting
    const ambientLight = new THREE.AmbientLight(0xcfd8dc, 1.25);
    scene.add(ambientLight);

    const sun = new THREE.DirectionalLight(0xfff5e6, 1.3);
    sun.position.set(6, 14, 8);
    sun.castShadow = true;
    sun.shadow.mapSize.width = 1024;
    sun.shadow.mapSize.height = 1024;
    sun.shadow.camera.near = 0.5;
    sun.shadow.camera.far = 30;
    sun.shadow.camera.left = -10;
    sun.shadow.camera.right = 10;
    sun.shadow.camera.top = 10;
    sun.shadow.camera.bottom = -10;
    scene.add(sun);

    // Arena Floor
    const floorGeo = new THREE.PlaneGeometry(24, 24);
    const floorMat = new THREE.MeshLambertMaterial({ color: 0x1f232d });
    const floor = new THREE.Mesh(floorGeo, floorMat);
    floor.rotation.x = -Math.PI / 2;
    floor.receiveShadow = true;
    scene.add(floor);

    // Arena Grid Lines (1m sub-grid)
    const gridHelper = new THREE.GridHelper(24, 24, 0x00d0e0, 0x2e3542);
    gridHelper.position.y = 0.005;
    scene.add(gridHelper);

    // Arena Walls
    const wallMat = new THREE.MeshLambertMaterial({ color: 0x151922 });
    const createWall = (w, h, d, x, y, z) => {
      const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), wallMat);
      mesh.position.set(x, y, z);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      scene.add(mesh);
    };
    createWall(24, 1.6, 0.8, 0, 0.8, -12.4); // North
    createWall(24, 1.6, 0.8, 0, 0.8, 12.4);  // South
    createWall(0.8, 1.6, 24, -12.4, 0.8, 0); // West
    createWall(0.8, 1.6, 24, 12.4, 0.8, 0);  // East

    // Four Decorative Arena Pillars
    const pillarMat = new THREE.MeshLambertMaterial({ color: 0x2a303c });
    const pillarGeo = new THREE.CylinderGeometry(0.55, 0.60, 2.2, 16);
    [[-6, -6], [6, -6], [-6, 6], [6, 6]].forEach(([px, pz]) => {
      const pil = new THREE.Mesh(pillarGeo, pillarMat);
      pil.position.set(px, 1.1, pz);
      pil.castShadow = true;
      pil.receiveShadow = true;
      scene.add(pil);
    });

    // ========================================================
    // --- 2. Voxel Helper & Hero Model ---
    // ========================================================
    const createVoxel = (w, h, d, color, x, y, z, parent) => {
      const geo = new THREE.BoxGeometry(w, h, d);
      const mat = new THREE.MeshLambertMaterial({ color: color });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.position.set(x, y, z);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      parent.add(mesh);
      return mesh;
    };

    const heroGroup = new THREE.Group();
    scene.add(heroGroup);

    // Hero Shadow
    const shadowGeo = new THREE.CylinderGeometry(0.42, 0.42, 0.02, 16);
    const shadowMat = new THREE.MeshBasicMaterial({ color: 0x05070a, transparent: true, opacity: 0.55 });
    const heroShadow = new THREE.Mesh(shadowGeo, shadowMat);
    heroShadow.position.y = 0.01;
    heroGroup.add(heroShadow);

    const heroBodyPivot = new THREE.Group();
    heroGroup.add(heroBodyPivot);

    // Hero Mesh Parts
    const heroMeshes = [];
    const addHeroVoxel = (w, h, d, color, x, y, z, parent = heroBodyPivot) => {
      const mesh = createVoxel(w, h, d, color, x, y, z, parent);
      heroMeshes.push({ mesh, originalColor: color });
      return mesh;
    };

    // Body
    addHeroVoxel(0.44, 0.38, 0.28, 0xd0bd95, 0, 0.52, 0); // Beige shirt
    addHeroVoxel(0.46, 0.08, 0.30, 0x5b4535, 0, 0.36, 0); // Belt
    addHeroVoxel(0.12, 0.09, 0.04, 0xf5c542, 0, 0.36, 0.16); // Buckle

    // Chibi Head & Silver Hair
    const headGroup = new THREE.Group();
    heroBodyPivot.add(headGroup);
    addHeroVoxel(0.48, 0.44, 0.44, 0xfac19e, 0, 0.95, 0, headGroup); // Face
    addHeroVoxel(0.09, 0.11, 0.03, 0x00d8e8, -0.13, 0.94, 0.23, headGroup); // Left Eye
    addHeroVoxel(0.09, 0.11, 0.03, 0x00d8e8, 0.13, 0.94, 0.23, headGroup);  // Right Eye
    addHeroVoxel(0.54, 0.20, 0.50, 0xc4c0c4, 0, 1.18, 0, headGroup); // Hair crown
    addHeroVoxel(0.18, 0.14, 0.10, 0xc4c0c4, 0.02, 1.10, 0.24, headGroup); // Bangs

    // Arms & Weapons
    const leftArmPivot = new THREE.Group();
    leftArmPivot.position.set(-0.25, 0.60, 0.04);
    leftArmPivot.rotation.set(-0.55, 0.35, 0.15);
    heroBodyPivot.add(leftArmPivot);
    addHeroVoxel(0.10, 0.16, 0.12, 0xd0bd95, 0, -0.06, 0, leftArmPivot);
    addHeroVoxel(0.09, 0.14, 0.10, 0xfac19e, 0, -0.19, 0.02, leftArmPivot);

    // Buckler Shield (Front Guard)
    const shieldGroup = new THREE.Group();
    shieldGroup.position.set(0.02, -0.16, 0.10);
    shieldGroup.rotation.set(0.40, -0.22, -0.12);
    leftArmPivot.add(shieldGroup);
    addHeroVoxel(0.26, 0.28, 0.04, 0x5a3d28, 0, 0, 0, shieldGroup);
    addHeroVoxel(0.28, 0.04, 0.05, 0x8898a8, 0, 0.13, 0.01, shieldGroup);
    addHeroVoxel(0.28, 0.04, 0.05, 0x8898a8, 0, -0.13, 0.01, shieldGroup);
    addHeroVoxel(0.12, 0.12, 0.05, 0x00d8e8, 0, 0, 0.03, shieldGroup); // Shield boss

    // Right Arm & Sword
    const rightArmPivot = new THREE.Group();
    rightArmPivot.position.set(0.25, 0.60, 0.04);
    rightArmPivot.rotation.set(-0.70, -0.20, -0.10);
    heroBodyPivot.add(rightArmPivot);
    addHeroVoxel(0.10, 0.16, 0.12, 0xd0bd95, 0, -0.06, 0, rightArmPivot);
    addHeroVoxel(0.09, 0.14, 0.10, 0xfac19e, 0, -0.19, 0.02, rightArmPivot);

    const swordGroup = new THREE.Group();
    swordGroup.position.set(0, -0.20, 0.08);
    swordGroup.rotation.set(0.95, 0.20, -0.25);
    rightArmPivot.add(swordGroup);
    addHeroVoxel(0.04, 0.12, 0.04, 0x4e3324, 0, -0.04, 0, swordGroup); // Grip
    addHeroVoxel(0.18, 0.04, 0.06, 0xf5c542, 0, 0.03, 0, swordGroup);  // Guard
    addHeroVoxel(0.06, 0.44, 0.02, 0xd0e0f0, 0, 0.26, 0, swordGroup);  // Blade

    // Legs
    const leftLeg = addHeroVoxel(0.15, 0.28, 0.16, 0x814126, -0.12, 0.14, 0);
    const rightLeg = addHeroVoxel(0.15, 0.28, 0.16, 0x814126, 0.12, 0.14, 0);

    // ========================================================
    // --- 3. Training Dummy Target (Layer 2 Combat Goal) ---
    // ========================================================
    const dummyGroup = new THREE.Group();
    dummyGroup.position.set(0, 0, -3.0);
    scene.add(dummyGroup);

    // Dummy Shadow
    const dummyShadow = new THREE.Mesh(shadowGeo, shadowMat);
    dummyShadow.position.y = 0.01;
    dummyGroup.add(dummyShadow);

    const dummyBodyPivot = new THREE.Group();
    dummyGroup.add(dummyBodyPivot);

    const dummyMeshes = [];
    const addDummyVoxel = (w, h, d, color, x, y, z, parent = dummyBodyPivot) => {
      const mesh = createVoxel(w, h, d, color, x, y, z, parent);
      dummyMeshes.push({ mesh, originalColor: color });
      return mesh;
    };

    // Robust Wooden Log Body
    addDummyVoxel(0.58, 0.85, 0.58, 0x8b5a2b, 0, 0.52, 0);
    addDummyVoxel(0.60, 0.08, 0.60, 0x4a2e18, 0, 0.50, 0); // Metal banding

    // Dummy Head & Target Markers
    addDummyVoxel(0.50, 0.46, 0.50, 0xa6703d, 0, 1.15, 0);
    addDummyVoxel(0.10, 0.10, 0.04, 0x1e293b, -0.14, 1.18, 0.26); // Left button eye
    addDummyVoxel(0.10, 0.10, 0.04, 0x1e293b, 0.14, 1.18, 0.26);  // Right button eye

    // Prominent Red Frontal Facing Horn/Spike (Indicates Frontal 90° Cone!)
    // Points forward towards +Z!
    const horn = addDummyVoxel(0.18, 0.18, 0.32, 0xef4444, 0, 0.90, 0.40);

    // Dummy Arms (T-Pose Straw training dummy)
    addDummyVoxel(0.36, 0.14, 0.14, 0x8b5a2b, -0.44, 0.70, 0);
    addDummyVoxel(0.36, 0.14, 0.14, 0x8b5a2b, 0.44, 0.70, 0);

    // Dummy Facing: Points towards +Z (South) by default
    const DUMMY_FACING_X = 0.0;
    const DUMMY_FACING_Z = 1.0;

    // ========================================================
    // --- 4. Kinematics, Bump Math & Combat Logic ---
    // ========================================================
    const MAX_SPEED = 5.2;
    const ACCEL = 42.0;
    const FRICTION = 48.0;

    let posX = 0, posZ = 0;
    let velX = 0, velZ = 0;
    let facingX = 0, facingZ = 1;
    let hopCycle = 0;

    // Combat Stats & States
    let heroHp = 100, heroMaxHp = 100;
    let dummyHp = 100, dummyMaxHp = 100;
    let heroCooldown = 0.0; // Base: 0.35s
    const BASE_COOLDOWN = 0.35;

    let heroKbX = 0, heroKbZ = 0;
    let dummyKbX = 0, dummyKbZ = 0;
    const KB_FRICTION = 28.0;

    let heroFlashTimer = 0.0;
    let dummyFlashTimer = 0.0;
    let hitstopTimer = 0.0;
    let shakeTimer = 0.0;

    // Input States
    const keys = { w: false, a: false, s: false, d: false, ArrowUp: false, ArrowLeft: false, ArrowDown: false, ArrowRight: false };
    let joyActive = false, joyInputX = 0, joyInputZ = 0;

    window.addEventListener('keydown', (e) => {
      if (keys.hasOwnProperty(e.key)) { keys[e.key] = true; e.preventDefault(); }
    });
    window.addEventListener('keyup', (e) => {
      if (keys.hasOwnProperty(e.key)) { keys[e.key] = false; e.preventDefault(); }
    });

    // Virtual Joystick
    const joyBase = document.getElementById('joystick-base');
    const joyKnob = document.getElementById('joystick-knob');
    let touchId = null, joyOriginX = 0, joyOriginY = 0;

    window.addEventListener('touchstart', (e) => {
      if (e.target.closest('#hud') || e.target.closest('#guide-box')) return;
      const t = e.changedTouches[0];
      touchId = t.identifier;
      joyActive = true;
      joyOriginX = t.clientX; joyOriginY = t.clientY;
      joyBase.style.left = joyOriginX + 'px'; joyBase.style.top = joyOriginY + 'px';
      joyKnob.style.left = joyOriginX + 'px'; joyKnob.style.top = joyOriginY + 'px';
      joyBase.style.display = 'block'; joyKnob.style.display = 'block';
    }, { passive: false });

    window.addEventListener('touchmove', (e) => {
      if (!joyActive) return;
      for (let i = 0; i < e.changedTouches.length; i++) {
        const t = e.changedTouches[i];
        if (t.identifier === touchId) {
          const dx = t.clientX - joyOriginX;
          const dy = t.clientY - joyOriginY;
          const dist = Math.hypot(dx, dy);
          const maxDist = 55;
          const angle = Math.atan2(dy, dx);
          const clamped = Math.min(dist, maxDist);
          joyKnob.style.left = (joyOriginX + Math.cos(angle) * clamped) + 'px';
          joyKnob.style.top = (joyOriginY + Math.sin(angle) * clamped) + 'px';
          joyInputX = (Math.cos(angle) * clamped) / maxDist;
          joyInputZ = (Math.sin(angle) * clamped) / maxDist;
          e.preventDefault();
          break;
        }
      }
    }, { passive: false });

    const endJoy = (e) => {
      for (let i = 0; i < e.changedTouches.length; i++) {
        if (e.changedTouches[i].identifier === touchId) {
          joyActive = false; touchId = null;
          joyInputX = 0; joyInputZ = 0;
          joyBase.style.display = 'none'; joyKnob.style.display = 'none';
          break;
        }
      }
    };
    window.addEventListener('touchend', endJoy);
    window.addEventListener('touchcancel', endJoy);

    // ========================================================
    // --- 5. Floating Text & Spark FX ---
    // ========================================================
    const ftContainer = document.getElementById('floating-text-container');
    const combatBanner = document.getElementById('combat-banner');

    function spawnFloatingDamage(text, color, worldPos) {
      const el = document.createElement('div');
      el.className = 'floating-dmg';
      el.textContent = text;
      el.style.color = color;

      // Project 3D world position to 2D screen
      const p = worldPos.clone().project(camera);
      const x = (p.x * 0.5 + 0.5) * window.innerWidth;
      const y = (-p.y * 0.5 + 0.5) * window.innerHeight;
      el.style.left = x + 'px';
      el.style.top = y + 'px';

      ftContainer.appendChild(el);
      setTimeout(() => el.remove(), 850);
    }

    // Spark Particle System
    const sparks = [];
    const sparkGeo = new THREE.BoxGeometry(0.08, 0.08, 0.08);
    function spawnSparks(x, y, z, colorHex, count = 12) {
      for (let i = 0; i < count; i++) {
        const mat = new THREE.MeshBasicMaterial({ color: colorHex });
        const m = new THREE.Mesh(sparkGeo, mat);
        m.position.set(x, y, z);
        scene.add(m);

        const angle = Math.random() * Math.PI * 2;
        const speed = 2.5 + Math.random() * 4.0;
        const upward = 1.5 + Math.random() * 3.5;
        sparks.push({
          mesh: m,
          vx: Math.cos(angle) * speed,
          vy: upward,
          vz: Math.sin(angle) * speed,
          life: 0.35 + Math.random() * 0.2
        });
      }
    }

    function updateSparks(dt) {
      for (let i = sparks.length - 1; i >= 0; i--) {
        const s = sparks[i];
        s.life -= dt;
        s.vy -= 14.0 * dt; // Gravity
        s.mesh.position.x += s.vx * dt;
        s.mesh.position.y += s.vy * dt;
        s.mesh.position.z += s.vz * dt;
        if (s.life <= 0) {
          scene.remove(s.mesh);
          s.mesh.geometry.dispose();
          s.mesh.material.dispose();
          sparks.splice(i, 1);
        }
      }
    }

    // ========================================================
    // --- 6. Layer 2 Micro Bump Resolution Function ---
    // ========================================================
    function resolveMicroBump() {
      const dummyX = dummyGroup.position.x;
      const dummyZ = dummyGroup.position.z;

      const diffX = posX - dummyX;
      const diffZ = posZ - dummyZ;
      const dist = Math.hypot(diffX, diffZ);
      const COLLISION_RADIUS = 0.85; // Sum of hero (0.40) & dummy (0.45) radii

      if (dist < COLLISION_RADIUS) {
        // Contact approach unit vector (from Dummy towards Hero)
        const contactX = diffX / (dist || 0.001);
        const contactZ = diffZ / (dist || 0.001);

        // Angle Evaluation: cos(theta) = F_target . V_contact
        const angleCos = DUMMY_FACING_X * contactX + DUMMY_FACING_Z * contactZ;
        const isFrontal = angleCos >= 0.70710678; // cos(45 deg) threshold

        // Penetration resolution
        const overlap = (COLLISION_RADIUS - dist) + 0.04;
        posX += contactX * (overlap * 0.5);
        posZ += contactZ * (overlap * 0.5);
        dummyGroup.position.x -= contactX * (overlap * 0.5);
        dummyGroup.position.z -= contactZ * (overlap * 0.5);

        // 1. Attack Cooldown Check (No-iFrame Multi-hit prevention)
        if (heroCooldown > 0.0) {
          // In cooldown: Rigid bounce separation ONLY, 0 damage!
          heroKbX = contactX * 3.8;
          heroKbZ = contactZ * 3.8;
          dummyKbX = -contactX * 1.8;
          dummyKbZ = -contactZ * 1.8;
          return;
        }

        // 2. Valid Hit Execution
        heroCooldown = BASE_COOLDOWN;
        hitstopTimer = 0.04; // 0.04s Micro-freeze
        shakeTimer = 0.14;   // Micro screen shake

        const hitPos = new THREE.Vector3(
          dummyX + contactX * 0.45,
          0.85,
          dummyZ + contactZ * 0.45
        );

        if (isFrontal) {
          // --- Frontal Clash: Mutual Damage ---
          const heroDmg = 6;
          const dummyDmg = 10;
          heroHp = Math.max(0, heroHp - heroDmg);
          dummyHp = Math.max(0, dummyHp - dummyDmg);

          // Equal knockback
          heroKbX = contactX * 5.2;
          heroKbZ = contactZ * 5.2;
          dummyKbX = -contactX * 4.8;
          dummyKbZ = -contactZ * 4.8;

          heroFlashTimer = 0.12;
          dummyFlashTimer = 0.12;

          spawnFloatingDamage(`💥 -${dummyDmg} CLASH!`, "#fca5a5", hitPos);
          spawnFloatingDamage(`⚠️ -${heroDmg} DAMAGE`, "#ef4444", new THREE.Vector3(posX, 1.2, posZ));
          spawnSparks(hitPos.x, hitPos.y, hitPos.z, 0xef4444, 16);

          combatBanner.className = 'frontal';
          combatBanner.innerHTML = `💥 <b>정면 충돌 (Frontal Clash)!</b> 상호 피해: 용사 -${heroDmg} HP, 더미 -${dummyDmg} HP`;
        } else {
          // --- Flank/Rear Advantage: Unilateral Strike ---
          const dummyDmg = 12; // Bonus damage
          dummyHp = Math.max(0, dummyHp - dummyDmg);

          // Heavy knockback on target, minor recoil on hero
          heroKbX = contactX * 1.4;
          heroKbZ = contactZ * 1.4;
          dummyKbX = -contactX * 6.8;
          dummyKbZ = -contactZ * 6.8;

          dummyFlashTimer = 0.14;

          spawnFloatingDamage(`⚡ -${dummyDmg} ADVANTAGE!`, "#34d399", hitPos);
          spawnFloatingDamage(`🛡️ 0 (SAFE)`, "#38bdf8", new THREE.Vector3(posX, 1.2, posZ));
          spawnSparks(hitPos.x, hitPos.y, hitPos.z, 0x38bdf8, 20);

          combatBanner.className = 'advantage';
          combatBanner.innerHTML = `⚡ <b>측/후면 일방 타격 (Advantage)!</b> 용사 0피해 방어, 더미 -${dummyDmg} HP & 강한 넉백!`;
        }

        // Loop continuous dummy HP recovery
        if (dummyHp <= 0) {
          dummyHp = dummyMaxHp;
        }
      }
    }

    // Flash Mesh Effect
    function setMeshColor(meshList, colorHex) {
      meshList.forEach(item => {
        item.mesh.material.color.setHex(colorHex);
      });
    }
    function restoreMeshColor(meshList) {
      meshList.forEach(item => {
        item.mesh.material.color.setHex(item.originalColor);
      });
    }

    // Reset Dummy Position Helper
    window.resetDummyPosition = () => {
      dummyGroup.position.set(0, 0, -3.0);
      dummyKbX = 0; dummyKbZ = 0;
      dummyHp = 100;
      combatBanner.className = '';
      combatBanner.innerHTML = '더미 인형 위치 및 HP 리셋 완료!';
    };

    // ========================================================
    // --- 7. Main Game Loop ---
    // ========================================================
    const heroHpFill = document.getElementById('hero-hp-fill');
    const heroHpVal = document.getElementById('hero-hp-val');
    const dummyHpFill = document.getElementById('dummy-hp-fill');
    const dummyHpVal = document.getElementById('dummy-hp-val');
    const cdFill = document.getElementById('cooldown-fill');
    const cdVal = document.getElementById('cooldown-val');

    let lastTime = performance.now();

    function animate(currentTime) {
      requestAnimationFrame(animate);

      const dt = Math.min((currentTime - lastTime) / 1000, 0.05);
      lastTime = currentTime;

      // 0. Hitstop (Micro-freeze 0.04s)
      if (hitstopTimer > 0.0) {
        hitstopTimer -= dt;
        renderer.render(scene, camera);
        return;
      }

      // 1. Attack Cooldown Update
      if (heroCooldown > 0.0) {
        heroCooldown = Math.max(0, heroCooldown - dt);
        const cdPercent = (heroCooldown / BASE_COOLDOWN) * 100;
        cdFill.style.width = cdPercent + '%';
        cdVal.textContent = heroCooldown.toFixed(2) + 's';
      } else {
        cdFill.style.width = '0%';
        cdVal.textContent = 'READY';
      }

      // Flash feedback timers
      if (heroFlashTimer > 0.0) {
        heroFlashTimer -= dt;
        setMeshColor(heroMeshes, 0xff4444);
        if (heroFlashTimer <= 0.0) restoreMeshColor(heroMeshes);
      }
      if (dummyFlashTimer > 0.0) {
        dummyFlashTimer -= dt;
        setMeshColor(dummyMeshes, 0xffe066);
        if (dummyFlashTimer <= 0.0) restoreMeshColor(dummyMeshes);
      }

      // 2. Input Processing
      let inputX = 0, inputZ = 0;
      if (keys.w || keys.ArrowUp) inputZ -= 1;
      if (keys.s || keys.ArrowDown) inputZ += 1;
      if (keys.a || keys.ArrowLeft) inputX -= 1;
      if (keys.d || keys.ArrowRight) inputX += 1;

      if (joyActive) {
        inputX = joyInputX;
        inputZ = joyInputZ;
      }

      const inputLen = Math.hypot(inputX, inputZ);
      let targetDirX = 0, targetDirZ = 0;
      if (inputLen > 0.05) {
        targetDirX = inputX / Math.max(1.0, inputLen);
        targetDirZ = inputZ / Math.max(1.0, inputLen);
      }

      // 3. Locomotion Kinematics
      const moveToward = (current, target, maxDelta) => {
        if (Math.abs(target - current) <= maxDelta) return target;
        return current + Math.sign(target - current) * maxDelta;
      };

      if (inputLen > 0.05) {
        velX = moveToward(velX, targetDirX * MAX_SPEED, ACCEL * dt);
        velZ = moveToward(velZ, targetDirZ * MAX_SPEED, ACCEL * dt);
        facingX = targetDirX;
        facingZ = targetDirZ;
      } else {
        velX = moveToward(velX, 0, FRICTION * dt);
        velZ = moveToward(velZ, 0, FRICTION * dt);
      }

      // 4. Knockback Damping
      heroKbX = moveToward(heroKbX, 0, KB_FRICTION * dt);
      heroKbZ = moveToward(heroKbZ, 0, KB_FRICTION * dt);
      dummyKbX = moveToward(dummyKbX, 0, KB_FRICTION * dt);
      dummyKbZ = moveToward(dummyKbZ, 0, KB_FRICTION * dt);

      // Apply velocity + knockback
      posX += (velX + heroKbX) * dt;
      posZ += (velZ + heroKbZ) * dt;

      // Dummy movement by knockback
      dummyGroup.position.x += dummyKbX * dt;
      dummyGroup.position.z += dummyKbZ * dt;

      // Arena boundary clamp
      posX = Math.max(-11.5, Math.min(11.5, posX));
      posZ = Math.max(-11.5, Math.min(11.5, posZ));
      dummyGroup.position.x = Math.max(-11.5, Math.min(11.5, dummyGroup.position.x));
      dummyGroup.position.z = Math.max(-11.5, Math.min(11.5, dummyGroup.position.z));

      heroGroup.position.set(posX, 0, posZ);

      // 5. Layer 2 Micro Bump Resolution
      resolveMicroBump();

      // 6. Crossy Road Hopping & Visuals
      const speed = Math.hypot(velX, velZ);
      if (speed > 0.15) {
        hopCycle += (speed / MAX_SPEED) * (Math.PI * 4.6) * dt;
        const hopArc = Math.sin(hopCycle % Math.PI);
        heroBodyPivot.position.y = hopArc * 0.28;
        heroBodyPivot.scale.set(1.08 - hopArc * 0.16, 0.88 + hopArc * 0.30, 1.08 - hopArc * 0.16);

        const targetYaw = Math.atan2(facingX, facingZ);
        heroGroup.rotation.y = targetYaw;
      } else {
        hopCycle = 0;
        heroBodyPivot.position.y = moveToward(heroBodyPivot.position.y, 0, 4.0 * dt);
        heroBodyPivot.scale.set(1.0, 1.0, 1.0);
      }

      // Update Particle FX
      updateSparks(dt);

      // 7. Orthogonal Camera Follow & Micro Screen Shake
      let shakeOffsetX = 0, shakeOffsetZ = 0;
      if (shakeTimer > 0.0) {
        shakeTimer -= dt;
        shakeOffsetX = (Math.random() - 0.5) * 0.18;
        shakeOffsetZ = (Math.random() - 0.5) * 0.18;
      }
      camera.position.x = posX + shakeOffsetX;
      camera.position.z = posZ + CAM_Z + shakeOffsetZ;
      camera.position.y = CAM_Y;

      // 8. HUD Bars Update
      heroHpFill.style.width = (heroHp / heroMaxHp * 100) + '%';
      heroHpVal.textContent = `${heroHp}/${heroMaxHp}`;
      dummyHpFill.style.width = (dummyHp / dummyMaxHp * 100) + '%';
      dummyHpVal.textContent = `${dummyHp}/${dummyMaxHp}`;

      renderer.render(scene, camera);
    }
    requestAnimationFrame(animate);

    // ========================================================
    // --- 8. UI Helpers & ViewSize Zoom ---
    // ========================================================
    window.updateViewSize = (val) => {
      orthoSize = parseFloat(val);
      document.getElementById('view-size-text').textContent = orthoSize.toFixed(1) + 'm';
      const a = window.innerWidth / window.innerHeight;
      camera.left = -orthoSize * a / 2;
      camera.right = orthoSize * a / 2;
      camera.top = orthoSize / 2;
      camera.bottom = -orthoSize / 2;
      camera.updateProjectionMatrix();

      document.querySelectorAll('.btn-row .btn').forEach(b => b.classList.remove('active'));
      const activeBtn = document.getElementById('btn-' + Math.round(orthoSize));
      if (activeBtn) activeBtn.classList.add('active');
    };

    window.toggleHud = () => {
      const b = document.getElementById('hud-body');
      const btn = document.getElementById('btn-toggle-hud');
      if (b.style.display === 'none') {
        b.style.display = 'block';
        btn.textContent = '🔼 접기';
      } else {
        b.style.display = 'none';
        btn.textContent = '🔽 메뉴';
      }
    };

    window.addEventListener('resize', () => {
      const a = window.innerWidth / window.innerHeight;
      camera.left = -orthoSize * a / 2;
      camera.right = orthoSize * a / 2;
      camera.top = orthoSize / 2;
      camera.bottom = -orthoSize / 2;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
